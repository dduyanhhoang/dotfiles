# ~/.psmux.conf — oh-my-tmux (gpakosz/.tmux) look & feel, ported to psmux on Windows
# Nguồn: https://github.com/gpakosz/.tmux
# Reload:  prefix + r      Sửa file:  prefix + e

# -- general -------------------------------------------------------------------
set -g prefix2 C-a                        # prefix phụ kiểu GNU-Screen (C-b vẫn dùng được)

set -g history-limit 5000                 # tăng scrollback
set -g mouse on
set -g base-index 1                       # window đánh số từ 1
set -g pane-base-index 1

set -g automatic-rename on
set -g renumber-windows on
set -g set-titles on
set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 10
set -g monitor-activity on
set -g mode-keys vi

# clear both screen and history

# -- config file ---------------------------------------------------------------

# -- sessions ------------------------------------------------------------------

# -- panes ---------------------------------------------------------------------



# -- windows -------------------------------------------------------------------

# -- mouse ---------------------------------------------------------------------

# -- copy mode -----------------------------------------------------------------


# -- theme: đồng bộ với dark/light mode của Windows -----------------------------
# Màu nằm ở hai file riêng, .psmux-theme.cmd đọc registry rồi source đúng file:
#   ~/.psmux-theme-dark.conf    bảng oh-my-tmux gốc
#   ~/.psmux-theme-light.conf   biến thể sáng
# ~/.psmux-theme-watch.ps1 chạy nền, 3s soát registry một lần, chỉ áp khi có đổi.
#   prefix + T = đồng bộ theo Windows và bỏ ghim; M-l = ép sáng+ghim; M-d = ép tối+ghim

# những thứ không phụ thuộc theme
set -g status-position bottom
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 1200  # thanh pin: 20 o, moi o mot ma mau
set -g window-status-separator ""
set -g window-status-format " #I #W#{?window_bell_flag,!,}#{?window_zoomed_flag,Z,} "
set -g window-status-current-format " #I #W#{?window_bell_flag,!,}#{?window_zoomed_flag,Z,} "

set-hook -g client-attached "run-shell 'C:/Users/al/.psmux-theme.cmd'"
set-hook -ga client-attached "run-shell -b 'pwsh -NoProfile -File C:/Users/al/.psmux-theme-watch.ps1'"


# chon theme roi source thang trong server nay (run-shell truyen sai TMUX)
if-shell "C:/Users/al/.psmux-theme-pick.cmd" 'source-file "C:/Users/al/.psmux-theme-active.conf"'
run-shell -b "pwsh -NoProfile -File C:/Users/al/.psmux-theme-watch.ps1"

# -- keybindings: file rieng, duoc nap lai sau moi lan doi theme -----------------
# psmux reset keytable ve mac dinh moi khi source-file, nen binds phai nap sau cung.
source-file "C:/Users/al/.psmux-binds.conf"
