# ~/.psmux.conf — oh-my-tmux (gpakosz/.tmux) look & feel, ported to psmux on Windows
# Nguồn: https://github.com/gpakosz/.tmux
# Reload:  prefix + r      Sửa file:  prefix + e

# -- general -------------------------------------------------------------------
set -g prefix2 C-a                        # prefix phụ kiểu GNU-Screen (C-b vẫn dùng được)

set -g history-limit 5000                 # tăng scrollback
set -g mouse on
set -g allow-passthrough on               # cho OSC di thang ra terminal (claude hoi mau nen bang OSC 11)
set -g base-index 1                       # window đánh số từ 1
set -g pane-base-index 1

set -g automatic-rename on
set -g renumber-windows on
set -g set-titles on
set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 10
set -g monitor-activity on
set -g mode-keys vi

# clear both screen and history

# -- config file ---------------------------------------------------------------

# -- sessions ------------------------------------------------------------------

# -- panes ---------------------------------------------------------------------



# -- windows -------------------------------------------------------------------

# -- mouse ---------------------------------------------------------------------

# -- copy mode -----------------------------------------------------------------


# -- theme ---------------------------------------------------------------------
# Bảng màu xanh dương cố định trong ~/.psmux-theme.conf, không còn theo
# dark/light của Windows nữa. ~/.psmux-battery-watch.ps1 chạy nền, 3s một lần
# đẩy thanh pin (@bat_*) vào mọi server psmux đang sống — psmux mỗi session
# một server, nên phải đẩy cho từng cái.

set -g status-position bottom
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 1200  # thanh pin: 20 o, moi o mot ma mau
set -g window-status-separator ""
set -g window-status-format " #I #W#{?window_bell_flag,!,}#{?window_zoomed_flag,Z,} "
set -g window-status-current-format " #I #W#{?window_bell_flag,!,}#{?window_zoomed_flag,Z,} "

source-file "C:/Users/al/.psmux-theme.conf"
run-shell -b "pwsh -NoProfile -File C:/Users/al/.psmux-battery-watch.ps1"

# -- keybindings: file rieng, nap sau cung -------------------------------------
# psmux reset keytable ve mac dinh moi khi source-file, nen binds phai nap sau cung.
source-file "C:/Users/al/.psmux-binds.conf"
