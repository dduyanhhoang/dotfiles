# ~/.psmux-theme.conf — bảng màu xanh dương cố định, đối xứng với bản tím của
# oh-my-tmux bên Linux (linux/tmux.conf.local). Không còn theo dark/light nữa.
#   #1c2333 nền bar (dark ngả xanh)   #38455c xám ngả xanh   #c0bfbc xám nhạt
#   #99c1f1 blue1   #62a0ea blue2   #3584e4 blue3 (nhấn)
#   #1c71d8 blue4   #1a5fb4 blue5   #f6f5f4 trắng

set -g status-style "fg=#c0bfbc,bg=#1c2333,none"
set -g message-style "fg=#1c2333,bg=#62a0ea,bold"
set -g message-command-style "fg=#62a0ea,bg=#1c2333,bold"
set -g mode-style "fg=#1c2333,bg=#62a0ea"

set -g pane-border-style "fg=#38455c"
set -g pane-active-border-style "fg=#3584e4"

set -g window-status-style "fg=#c0bfbc,bg=#1c2333,none"
set -g window-status-current-style "fg=#1c2333,bg=#3584e4,bold"
set -g window-status-last-style "fg=#3584e4,bg=#38455c,none"
set -g window-status-activity-style "fg=#c0bfbc,bg=#1c2333,underscore"
set -g window-status-bell-style "fg=#62a0ea,bg=#1c2333,blink,bold"

set -g status-left "#[fg=#1c2333,bg=#62a0ea,bold] ❐ #S #[fg=#f6f5f4,bg=#1a5fb4,none] #{b:pane_current_path} #[fg=#c0bfbc,bg=#1c2333,none] "
set -g status-right "#[fg=#c0bfbc,bg=#1c2333,none] #{?client_prefix,⌨ ,}#{?#{==:#{mouse},on},↗ ,}#{?#{==:#{synchronize-panes},on},⚏ ,}#{@bat_pre}#[fg=#1a5fb4]#{@bat_c1}#[fg=#286abb]#{@bat_c2}#[fg=#3675c2]#{@bat_c3}#[fg=#4480c8]#{@bat_c4}#[fg=#528bcf]#{@bat_c5}#[fg=#6195d6]#{@bat_c6}#[fg=#6fa0dd]#{@bat_c7}#[fg=#7dabe3]#{@bat_c8}#[fg=#8bb6ea]#{@bat_c9}#[fg=#99c1f1]#{@bat_c10}#[fg=#38455c]#{@bat_rest}#[fg=#1a5fb4]#{@bat_t1}#[fg=#286abb]#{@bat_t2}#[fg=#3675c2]#{@bat_t3}#[fg=#4480c8]#{@bat_t4}#[fg=#528bcf]#{@bat_t5}#[fg=#6195d6]#{@bat_t6}#[fg=#6fa0dd]#{@bat_t7}#[fg=#7dabe3]#{@bat_t8}#[fg=#8bb6ea]#{@bat_t9}#[fg=#99c1f1]#{@bat_t10}#[fg=#c0bfbc,bg=#1c2333,none]#{@bat_post}%R | %d %b #[fg=#f6f5f4,bg=#1c71d8,none] #{user} #[fg=#1c2333,bg=#f6f5f4,bold] #{host_short} "
