# ~/.psmux-theme-light.conf — biến thể sáng, dùng khi Windows ở light mode
# Giữ nguyên cấu trúc và sắc độ của oh-my-tmux, nhưng đảo tương phản: bar sáng,
# chữ tối, các khối nhấn dùng bản đậm của cùng tông màu để nổi trên nền sáng.
#   #dadada nền bar     #bcbcbc xám phụ     #4e4e4e chữ
#   #005fd7 xanh        #af8700 hổ phách    #af005f hồng
#   #af0000 đỏ          #303030 xám đậm     #ffd700 vàng (message)

set -g status-style "fg=#4e4e4e,bg=#dadada,none"
set -g message-style "fg=#080808,bg=#ffd700,bold"
set -g message-command-style "fg=#ffd700,bg=#303030,bold"
set -g mode-style "fg=#080808,bg=#ffd700"

set -g pane-border-style "fg=#bcbcbc"
set -g pane-active-border-style "fg=#005fd7"

set -g window-status-style "fg=#4e4e4e,bg=#dadada,none"
set -g window-status-current-style "fg=#ffffff,bg=#005fd7,bold"
set -g window-status-last-style "fg=#005fd7,bg=#bcbcbc,none"
set -g window-status-activity-style "fg=#4e4e4e,bg=#dadada,underscore"
set -g window-status-bell-style "fg=#af0000,bg=#dadada,blink,bold"

set -g status-left "#[fg=#ffffff,bg=#af8700,bold] ❐ #S #[fg=#ffffff,bg=#af005f,none] #{b:pane_current_path} #[fg=#4e4e4e,bg=#dadada,none] "
set -g status-right "#[fg=#4e4e4e,bg=#dadada,none] #{?client_prefix,⌨ ,}#{?#{==:#{mouse},on},↗ ,}#{?#{==:#{synchronize-panes},on},⚏ ,}#{@bat_pre}#[fg=#ff0000]#{@bat_c1}#[fg=#ff3900]#{@bat_c2}#[fg=#ff7100]#{@bat_c3}#[fg=#ffaa00]#{@bat_c4}#[fg=#ffe300]#{@bat_c5}#[fg=#e3ff00]#{@bat_c6}#[fg=#aaff00]#{@bat_c7}#[fg=#71ff00]#{@bat_c8}#[fg=#39ff00]#{@bat_c9}#[fg=#00ff00]#{@bat_c10}#[fg=#b2b2b2]#{@bat_rest}#[fg=#ff0000]#{@bat_t1}#[fg=#ff3900]#{@bat_t2}#[fg=#ff7100]#{@bat_t3}#[fg=#ffaa00]#{@bat_t4}#[fg=#ffe300]#{@bat_t5}#[fg=#e3ff00]#{@bat_t6}#[fg=#aaff00]#{@bat_t7}#[fg=#71ff00]#{@bat_t8}#[fg=#39ff00]#{@bat_t9}#[fg=#00ff00]#{@bat_t10}#[fg=#4e4e4e,bg=#dadada,none]#{@bat_post}%R | %d %b #[fg=#ffffff,bg=#af0000,none] #{user} #[fg=#ffffff,bg=#303030,bold] #{host_short} "
